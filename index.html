<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quran</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/responsive.css">
    <script defer src="js/responsive.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/sw.js"></script>
    <link rel="icon" type="image/x-icon" href="./img/quran.png">
    <link rel="manifest" href="assets/manifest.json">
</head>
<body>
<button id="menu-toggle" class="menu-btn">☰ Surah List</button>
<div class="container">
    <!--   Surah List     -->
    <div class="side-bar">
        <h2 class="title__arb__color">Surah List</h2>

        <!-- 🔍 Search box -->
        <input type="text" id="surah_search" placeholder="🔎 Search Surah...">

        <!-- Suggestions -->
        <ul id="suggestions"></ul>

        <ul class="surah__list" id="surah_list">
        </ul>
    </div>
    <!--    Ayah    -->
    <div class="content">
        <h2 class="title__eng" id="title__eng"></h2>
        <h1 class="title__arb" id="title__arb"></h1>
        <p id="surah_info" class="title__arb"></p>
        <div class="action__area">
            <div class="nav__btn_area">
                <button class="btn" id="prev__btn">Previous</button>
                <button class="btn" id="next__btn">Next</button>
            </div>
            <div class="load__btn__area">
                <label>
                    <b class="title__color">Surah</b> &nbsp;
                    <input type="number" name="surah_num" id="surah_num" value="1" placeholder="Surah Number (1-114)"/>
                </label>
                <label>
                    &nbsp; <b class="title__color">Ayah</b> &nbsp;
                    <input type="number" name="surah_num" id="ayah_num" value="1" placeholder="Ayah Number"/>
                </label>
                <select id="language" class="btn">
                    <option value="eng">English</option>
                    <option value="arb">Arabic</option>
                </select>
                <button class="btn" id="load__btn">Load</button>
            </div>
        </div>
        <div class="result__area">
            <ul id="ayat__list"></ul>
        </div>
    </div>
</div>
<footer>
    Developed by <a href="https://sadiul-hakim.github.io/Sadi_ul_Hakim/" target="_blank">Sadi ul Hakim</a>,and thanks
    to
    <a href="https://alquran.cloud/" target="_blank">AlQuran Cloud</a> for providing Quran data
</footer>
</body>
</html>
